[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversion-engine"
version = "0.1.0a0"
description = "Tenacious Consulting outbound conversion agent (interim submission)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "numpy>=1.26",
    "python-dateutil>=2.9",
    "email-validator>=2.1",
    "mcp>=1.0",
]

[project.scripts]
convergine-hubspot-mcp = "agent.integrations.hubspot_mcp_server:main"

[project.optional-dependencies]
live = ["langfuse>=2.0", "resend>=0.7", "playwright>=1.42"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["agent*"]
exclude = ["tests*", "__specs*", "__plans*"]
